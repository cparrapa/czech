<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Czech It Up - A1 Neobrutalism 6</title>
    <!-- Using a bold, quirky font for that neobrutalist feel -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4db5e;
            --card-bg: #ffffff;
            --text-main: #111111;
            --border-color: #000000;
            --accent-blue: #70d6ff;
            --accent-pink: #ff70a6;
            --accent-green: #52b788;
            --accent-red: #ff9770;
            --accent-purple: #9d4edd;
            --accent-yellow: #ffd166;
            --accent-orange: #fca311;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Neobrutalism Base Class */
        .brutal {
            border: 4px solid var(--border-color);
            box-shadow: 6px 6px 0px var(--border-color);
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
        }

        .brutal-btn {
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            padding: 12px 24px;
            background: var(--card-bg);
            border: 4px solid var(--border-color);
            box-shadow: 4px 4px 0px var(--border-color);
            border-radius: 8px;
            transition: all 0.1s ease;
            font-family: inherit;
        }

        .brutal-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--border-color);
        }

        .brutal-input {
            padding: 12px;
            border: 3px solid var(--border-color);
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            box-shadow: 3px 3px 0px var(--border-color);
            outline: none;
            width: 100%;
            background: #fff;
            transition: all 0.1s ease;
        }
        
        .brutal-input:focus {
            box-shadow: 0px 0px 0px var(--border-color);
            transform: translate(3px, 3px);
            background: #fdfdfd;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }
        /* Top Bar: Stats & Gamification */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .nav-menu {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
            flex-wrap: wrap;
        }

        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-color);
            opacity: 0.7;
            min-width: 100px;
            font-size: 0.9rem;
        }

        .nav-tab.active {
            opacity: 1;
            background: var(--accent-yellow);
            box-shadow: 5px 5px 0px var(--border-color);
            transform: translate(-2px, -2px);
        }

        /* Tabs content visibility */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        /* Card Container & Flip Logic */
        .card-container {
            width: 100%;
            height: 640px; /* Increased slightly to fit example sentences */
            perspective: 1000px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background-color: var(--card-bg);
            padding: 25px;
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* Allows scrolling if content is too long */
            overflow-x: hidden;
        }

        /* Hide scrollbar for a cleaner look */
        .card-face::-webkit-scrollbar { width: 0px; }

        .card-front {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #fdfdfd;
        }

        /* Card Content Styles */
        .word-header {
            text-align: center;
            font-size: 3.2rem;
            font-weight: 700;
            margin: 20px 0;
            word-wrap: break-word;
        }

        .b-word-header {
            font-size: 2.2rem;
            margin-bottom: 5px;
            margin-top: 0;
            text-align: center;
        }

        .emoji-back {
            font-size: 3.5rem;
            text-align: center;
            margin-bottom: 5px;
        }

        .hint {
            background: var(--accent-blue);
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            width: 100%;
            margin-bottom: 15px;
        }

        .example-back {
            background: var(--accent-green);
            color: #fff;
            text-shadow: 1px 1px 0 #000;
        }

        .audio-btn {
            background: var(--accent-red);
            font-size: 1.1rem;
            padding: 15px 30px;
            width: 80%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: auto;
        }

        /* Tags for Back of Card */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .tag {
            padding: 4px 10px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .t-gender { background: var(--accent-pink); }
        .t-grammar { background: var(--accent-blue); }
        .t-topic { background: var(--accent-yellow); }
        .t-plural { background: #eee; }

        .translations {
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-align: center;
            background: #fff;
            border: 2px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            box-shadow: 2px 2px 0px var(--border-color);
        }
        
        .translations p { margin: 5px 0; }

        .conjugation-box {
            background: var(--accent-purple);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 15px;
            color: #fff;
        }

        .conjugation-box h3 {
            font-size: 1rem;
            margin-bottom: 8px;
            text-align: center;
            text-transform: uppercase;
        }

        .conjugation-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .conj-item {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border: 2px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .conj-pronoun { font-weight: normal; font-size: 0.8rem; color: #444; }
        
        .fun-fact {
            background: var(--bg-color);
            padding: 12px;
            border: 2px solid var(--border-color);
            font-size: 0.95rem;
            margin-bottom: 20px;
            border-radius: 6px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .action-buttons button { flex: 1; font-size: 0.9rem; padding: 12px 10px; }
        .btn-correct { background-color: var(--accent-green); }
        .btn-train { background-color: var(--accent-pink); }
        .btn-flip { background-color: var(--text-main); color: white; width: 100%; margin-top: auto; }

        .dictionary-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            background: var(--card-bg);
            padding: 15px;
            border: 4px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 4px 4px 0px var(--border-color);
        }

        .filter-group {
            display: flex;
            gap: 10px;
        }

        .dict-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 5px;
            padding-bottom: 20px;
        }
        
        .dict-list::-webkit-scrollbar { width: 8px; }
        .dict-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

        .dict-item {
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 3px 3px 0px var(--border-color);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .dict-item:hover {
            background: #fdfdfd;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-color);
        }

        .dict-word-title { font-size: 1.4rem; font-weight: bold; }
        .dict-translations { color: #555; font-size: 0.95rem; margin-top: 5px; }

        .mastery-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-weight: bold;
        }

        .mastery-good { background: var(--accent-green); }
        .mastery-ok { background: var(--accent-yellow); }
        .mastery-bad { background: var(--accent-pink); }
        .mastery-none { background: #eee; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            width: 100%;
            max-width: 500px;
            height: 640px;
            position: relative;
            transform: none; /* Overriding card-back transform */
            border-radius: 8px;
        }

        .close-modal-btn {
            background: var(--text-main);
            color: white;
            width: 100%;
            margin-top: auto;
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .stat-card h3 { font-size: 1rem; text-transform: uppercase; color: #555; }
        .stat-card .value { font-size: 2.5rem; font-weight: bold; }
        
        .c-blue { background: var(--accent-blue); }
        .c-green { background: var(--accent-green); }
        .c-pink { background: var(--accent-pink); }
        .c-red { background: var(--accent-red); }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #eee;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            background: var(--text-main);
            width: 0%;
            transition: width 0.3s;
        }

        .backup-controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .backup-controls button { flex: 1; }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="brutal">
            <div>🇨🇿 Czech It Up A1</div>
            <div style="font-size: 1rem;">
                Lvl <span id="top-level" style="background:var(--accent-yellow); padding: 2px 8px; border:2px solid #000; border-radius:4px;">1</span>
            </div>
        </header>

        <!-- Navigation -->
        <div class="nav-menu">
            <div class="nav-tab active" onclick="switchTab('practice')" id="tab-btn-practice">Cards 📇</div>
            <div class="nav-tab" onclick="switchTab('dictionary')" id="tab-btn-dictionary">Browse 📖</div>
            <div class="nav-tab" onclick="switchTab('stats')" id="tab-btn-stats">Stats 📊</div>
        </div>

        <!-- Practice Tab -->
        <div id="view-practice" class="tab-content active">
            <div class="card-container">
                <div class="flashcard brutal" id="flashcard">
                    <!-- FRONT OF CARD -->
                    <div class="card-face card-front">
                        <button class="brutal-btn audio-btn" onclick="playAudio(event, 'f-word')" title="Play pronunciation">
                            <span>🔊</span> Poslechnout
                        </button>
                        
                        <h1 class="word-header" id="f-word">Word</h1>
                        <div class="hint brutal" id="f-hint" style="display: none;">Hint here</div>
                        <button class="brutal-btn btn-flip" onclick="flipCard()">Zobrazit odpověď 👁️</button>
                    </div>

                    <!-- BACK OF CARD -->
                    <div class="card-face card-back" id="card-back-content">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>

        <div id="view-dictionary" class="tab-content">
            <div class="dictionary-controls">
                <input type="text" id="dict-search" class="brutal-input" placeholder="Search for a word (Czech or English)..." oninput="renderDictionary()">
                <div class="filter-group">
                    <select id="dict-grammar" class="brutal-input" onchange="renderDictionary()">
                        <option value="All">All Grammar</option>
                        <option value="Noun">Nouns</option>
                        <option value="Verb">Verbs</option>
                        <option value="Adjective">Adjectives</option>
                        <option value="Adverb">Adverbs</option>
                        <option value="Pronoun">Pronouns</option>
                        <option value="Conjunction">Conjunctions</option>
                        <option value="Phrase">Phrases</option>
                        <option value="Number">Numbers</option>
                    </select>
                    <select id="dict-sort" class="brutal-input" onchange="renderDictionary()">
                        <option value="alpha">A-Z (Alphabetical)</option>
                        <option value="weakest">Needs Practice (Low Mastery)</option>
                        <option value="strongest">Mastered (High Mastery)</option>
                    </select>
                </div>
            </div>
            
            <div class="dict-list" id="dict-list-container">
                <!-- Dictionary items rendered via JS -->
            </div>
        </div>

        <!-- Stats Tab -->
        <div id="view-stats" class="tab-content">
            <div class="stats-grid">
                <div class="stat-card brutal c-blue">
                    <h3>Total XP</h3>
                    <div class="value" id="stat-xp">0</div>
                </div>
                <div class="stat-card brutal c-green">
                    <h3>Current Level</h3>
                    <div class="value" id="stat-level">1</div>
                    <div class="progress-bar"><div class="progress-fill" id="stat-progress"></div></div>
                </div>
                <div class="stat-card brutal c-pink">
                    <h3>Cards Reviewed</h3>
                    <div class="value" id="stat-reviewed">0</div>
                </div>
                <div class="stat-card brutal c-red">
                    <h3>Accuracy</h3>
                    <div class="value" id="stat-accuracy">0%</div>
                </div>
            </div>
            
            <div class="backup-controls">
                <button class="brutal-btn" style="background: var(--accent-blue);" onclick="exportProgress()">Export Data 💾</button>
                <button class="brutal-btn" style="background: var(--accent-yellow);" onclick="document.getElementById('import-file').click()">Import Data 📂</button>
                <input type="file" id="import-file" style="display:none;" accept=".json" onchange="importProgress(event)">
            </div>

            <button class="brutal-btn" style="width: 100%; margin-top: 15px; background: white;" onclick="resetProgress()">
                Reset Progress ⚠️
            </button>
        </div>
    </div>

    <div id="word-modal" class="modal-overlay" style="display:none;" onclick="closeModal(event)">
        <div class="modal-content brutal card-face card-back" id="modal-content-area" onclick="event.stopPropagation()">
            <!-- Populated by JS to look exactly like the back of the card -->
        </div>
    </div>

    <script>
        // Extensively expanded list based on the A1 curriculum provided, with sentences and notes!
        const vocabData = [
            // VERBS (With Conjugations & Sentences)
            { word: "Být", emoji: "🧍", hint: "Já ___ student.", example: "Já <b>jsem</b> student.", grammar: "Verb", topic: "Basic Verbs", en: "To be", es: "Ser/Estar", conjugations: { ja: "jsem", ty: "jsi", on: "je", my: "jsme", vy: "jste", oni: "jsou" }, note: "The most common verb in Czech. Often omitted in third person present in informal speech." },

            { word: "Psát", emoji: "✍️", hint: "Já ___ e-mail.", example: "Já <b>píšu</b> e-mail.", grammar: "Verb", topic: "School", en: "To write", es: "Escribir", conjugations: { ja: "píšu", ty: "píšeš", on: "píše", my: "píšeme", vy: "píšete", oni: "píšou" } },

            { word: "Věc", emoji: "📦", hint: "To je moje ___.", example: "To je moje <b>věc</b>.", grammar: "Noun", gender: "Feminine", plural: "věci", topic: "Objects", en: "Thing", es: "Cosa" },
            { word: "Zpívat", emoji: "🎤", hint: "Ona krásně ___.", example: "Ona krásně <b>zpívá</b>.", grammar: "Verb", topic: "Hobbies", en: "To sing", es: "Cantar", conjugations: { ja: "zpívám", ty: "zpíváš", on: "zpívá", my: "zpíváme", vy: "zpíváte", oni: "zpívají" } },
            { word: "Žena", emoji: "👩", hint: "Ta ___ je krásná.", example: "Ta <b>žena</b> je krásná.", grammar: "Noun", gender: "Feminine", plural: "ženy", topic: "People", en: "Woman / Wife", es: "Mujer / Esposa" },
            { word: "Dva / Dvě", emoji: "2️⃣", hint: "Mám ___ auta.", example: "Mám <b>dvě</b> auta.", grammar: "Number", topic: "Numbers", en: "Two", es: "Dos", note: "Dva (Masculine) / Dvě (Feminine & Neuter)." },
            { word: "Tři", emoji: "3️⃣", hint: "Vidím ___ lidi.", example: "Vidím <b>tři</b> lidi.", grammar: "Number", topic: "Numbers", en: "Three", es: "Tres" },
            { word: "Čtyři", emoji: "4️⃣", hint: "Stůl má ___ nohy.", example: "Stůl má <b>čtyři</b> nohy.", grammar: "Number", topic: "Numbers", en: "Four", es: "Cuatro" },
            { word: "Pět", emoji: "5️⃣", hint: "Mám ___ korun.", example: "Mám <b>pět</b> korun.", grammar: "Number", topic: "Numbers", en: "Five", es: "Cinco", note: "Numbers 5 and up require the genitive plural for nouns." },
            { word: "Rodina", emoji: "👨‍👩‍👧", hint: "Moje ___ je velká.", example: "Moje <b>rodina</b> je velká.", grammar: "Noun", gender: "Feminine", plural: "rodiny", topic: "Family", en: "Family", es: "Familia" },
            { word: "Matka / Máma", emoji: "🤱", hint: "Moje ___ dobře vaří.", example: "Moje <b>máma</b> dobře vaří.", grammar: "Noun", gender: "Feminine", topic: "Family", en: "Mother / Mom", es: "Madre / Mamá" },
            { word: "Otec / Táta", emoji: "👨‍🍼", hint: "Můj ___ pracuje v bance.", example: "Můj <b>táta</b> pracuje v bance.", grammar: "Noun", gender: "Masculine Animate", topic: "Family", en: "Father / Dad", es: "Padre / Papá" },
            { word: "Bratr", emoji: "👦", hint: "Mám mladšího ___a.", example: "Mám mladšího <b>bratra</b>.", grammar: "Noun", gender: "Masculine Animate", plural: "bratři", topic: "Family", en: "Brother", es: "Hermano" },
            { word: "Sestra", emoji: "👧", hint: "Moje ___ studuje.", example: "Moje <b>sestra</b> studuje.", grammar: "Noun", gender: "Feminine", plural: "sestry", topic: "Family", en: "Sister", es: "Hermana" },
            { word: "Bílý", emoji: "⚪", hint: "Mám ___ sníh.", example: "Mám <b>bílý</b> sníh.", grammar: "Adjective", topic: "Colors", en: "White", es: "Blanco" },
            { word: "Černý", emoji: "⚫", hint: "Piju ___ čaj.", example: "Piju <b>černý</b> čaj.", grammar: "Adjective", topic: "Colors", en: "Black", es: "Negro" },
            { word: "Červený", emoji: "🔴", hint: "Koupil ___ auto.", example: "Koupil <b>červené</b> auto.", grammar: "Adjective", topic: "Colors", en: "Red", es: "Rojo" },
            { word: "Modrý", emoji: "🔵", hint: "Nebe je ___.", example: "Nebe je <b>modré</b>.", grammar: "Adjective", topic: "Colors", en: "Blue", es: "Azul" },
            { word: "Zelený", emoji: "🟢", hint: "Tráva je ___.", example: "Tráva je <b>zelená</b>.", grammar: "Adjective", topic: "Colors", en: "Green", es: "Verde" },
            { word: "Žlutý", emoji: "🟡", hint: "Slunce je ___.", example: "Slunce je <b>žluté</b>.", grammar: "Adjective", topic: "Colors", en: "Yellow", es: "Amarillo" }
        ];

        const STORAGE_KEY = 'czechA1AppProgressV3';
        
        let appState = {
            xp: 0,
            level: 1,
            cardsReviewed: 0,
            correctAnswers: 0,
            queue: [], // Array of indices
            currentQueuePos: 0,
            wordStats: {} // Tracks individual word mastery { "Být": { seen: 0, correct: 0 } }
        };

        const xpPerLevel = 50;

        function initApp() {
            loadState();
            
            // Ensure all words exist in wordStats
            vocabData.forEach(item => {
                if (!appState.wordStats[item.word]) {
                    appState.wordStats[item.word] = { seen: 0, correct: 0 };
                }
            });

            if (appState.queue.length === 0 || appState.currentQueuePos >= appState.queue.length) {
                generateQueue();
            }
            
            updateStatsUI();
            loadCardToDOM(appState.queue[appState.currentQueuePos]);
            // Ensure dictionary is populated immediately
            renderDictionary(); 
        }

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    // Merge saved state with defaults to handle version updates
                    appState = { ...appState, ...parsed };
                    if (!appState.wordStats) appState.wordStats = {};
                    if (!appState.queue || appState.queue.length === 0) generateQueue();
                } catch (e) {
                    console.error("Failed to parse save data");
                }
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        }

        function generateQueue() {
            // Focus queue slightly on words with lower mastery in the future, 
            // for now purely random shuffle of the entire deck.
            let indices = Array.from({length: vocabData.length}, (_, i) => i);
            // Fisher-Yates Shuffle for anti-repetition
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            appState.queue = indices;
            appState.currentQueuePos = 0;
            saveState();
        }

        function buildCardBackHTML(data, isModal = false) {
            let html = `
                <div class="emoji-back" id="b-emoji">${data.emoji || '🇨🇿'}</div>
                <h1 class="word-header b-word-header" id="b-word">${data.word}</h1>
                
                <div class="tags">
                    ${data.grammar ? `<span class="tag t-grammar">${data.grammar}</span>` : ''}
                    ${data.gender ? `<span class="tag t-gender">${data.gender}</span>` : ''}
                    ${data.topic ? `<span class="tag t-topic">${data.topic}</span>` : ''}
                    ${data.plural ? `<span class="tag t-plural">Plural: ${data.plural}</span>` : ''}
                </div>`;

            if (data.example) {
                html += `<div class="hint brutal example-back" id="b-example">${data.example}</div>`;
            }

            html += `
                <div class="translations">
                    <p>🇬🇧 <strong>EN:</strong> <span id="b-en">${data.en || 'N/A'}</span></p>
                    <p>🇪🇸 <strong>ES:</strong> <span id="b-es">${data.es || 'N/A'}</span></p>
                </div>`;

            if (data.grammar === 'Verb' && data.conjugations) {
                html += `
                <div class="conjugation-box" id="b-conjugations">
                    <h3>Conjugation (Present)</h3>
                    <div class="conjugation-grid">
                        <div class="conj-item"><span class="conj-pronoun">já</span> <span>${data.conjugations.ja}</span></div>
                        <div class="conj-item"><span class="conj-pronoun">my</span> <span>${data.conjugations.my}</span></div>
                        <div class="conj-item"><span class="conj-pronoun">ty</span> <span>${data.conjugations.ty}</span></div>
                        <div class="conj-item"><span class="conj-pronoun">vy</span> <span>${data.conjugations.vy}</span></div>
                        <div class="conj-item"><span class="conj-pronoun">on/a/to</span> <span>${data.conjugations.on}</span></div>
                        <div class="conj-item"><span class="conj-pronoun">oni/y/a</span> <span>${data.conjugations.oni}</span></div>
                    </div>
                </div>`;
            }

            if (data.note) {
                html += `<div class="fun-fact" id="b-note">💡 <strong>Note:</strong> ${data.note}</div>`;
            }

            if (isModal) {
                html += `<button class="brutal-btn close-modal-btn" onclick="closeModal(event)">Close ❌</button>`;
            } else {
                html += `
                <div class="action-buttons">
                    <button class="brutal-btn btn-train" onclick="handleAnswer(false)">Znovu 🧠</button>
                    <button class="brutal-btn btn-correct" onclick="handleAnswer(true)">Umím! ✅</button>
                </div>`;
            }

            return html;
        }

        const card = document.getElementById('flashcard');

        function loadCardToDOM(vocabIndex) {
            // Guard clause if index is somehow invalid
            if (vocabIndex === undefined || !vocabData[vocabIndex]) {
                generateQueue();
                vocabIndex = appState.queue[appState.currentQueuePos];
            }

            const data = vocabData[vocabIndex];
            
            // Front
            document.getElementById('f-word').innerText = data.word;
            const hintEl = document.getElementById('f-hint');
            if (data.hint) {
                hintEl.innerHTML = data.hint;
                hintEl.style.display = 'block';
            } else {
                hintEl.style.display = 'none';
            }
            
            // Back
            const backContainer = document.getElementById('card-back-content');
            backContainer.innerHTML = buildCardBackHTML(data, false);

            // Reset visual flip
            card.style.transition = 'none';
            card.classList.remove('is-flipped');
            setTimeout(() => { card.style.transition = 'transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1)'; }, 50);
        }

        function flipCard() {
            card.classList.add('is-flipped');
        }
        // Simulating Audio (Using Web Speech API)
        function playAudio(event, elementId = null, specificWord = null) {
            event.stopPropagation(); 
            
            let wordToSay = specificWord;
            if (!wordToSay) {
                if (elementId) {
                    wordToSay = document.getElementById(elementId).innerText;
                } else {
                    const index = appState.queue[appState.currentQueuePos];
                    wordToSay = vocabData[index].word;
                }
            }
            
            const utterance = new SpeechSynthesisUtterance(wordToSay);
            utterance.lang = 'cs-CZ'; 
            utterance.rate = 0.85; // Slightly slower for learning
            
            window.speechSynthesis.speak(utterance);
        }

        // Handle the user's answer
        function handleAnswer(wasCorrect) {
            const currentWord = vocabData[appState.queue[appState.currentQueuePos]].word;
            
            // Update word mastery stats
            if (!appState.wordStats[currentWord]) {
                appState.wordStats[currentWord] = { seen: 0, correct: 0 };
            }
            appState.wordStats[currentWord].seen++;
            if (wasCorrect) {
                appState.wordStats[currentWord].correct++;
                appState.correctAnswers++;
                appState.xp += 10;
                
                // Level Up Check
                const newLevel = Math.floor(appState.xp / xpPerLevel) + 1;
                if (newLevel > appState.level) {
                    appState.level = newLevel;
                    // Removed alert for uninterrupted flow!
                }
            }
            // Move queue forward
            appState.cardsReviewed++;
            appState.currentQueuePos++;
            
            // Check if queue is finished
            if (appState.currentQueuePos >= appState.queue.length) {
                // Silently loop and reshuffle when deck finishes to avoid popup interruptions
                generateQueue();
            }

            saveState();
            updateStatsUI();
            if (document.getElementById('view-dictionary').classList.contains('active')) {
                renderDictionary(); // Update mastery badges in background
            }
            loadCardToDOM(appState.queue[appState.currentQueuePos]);
        }

        function updateStatsUI() {
            document.getElementById('top-level').innerText = appState.level;
            document.getElementById('stat-xp').innerText = appState.xp;
            document.getElementById('stat-level').innerText = appState.level;
            document.getElementById('stat-reviewed').innerText = appState.cardsReviewed;
            
            let accuracy = 0;
            if (appState.cardsReviewed > 0) {
                accuracy = Math.round((appState.correctAnswers / appState.cardsReviewed) * 100);
            }
            document.getElementById('stat-accuracy').innerText = `${accuracy}%`;

            // Progress bar to next level
            const xpInCurrentLevel = appState.xp % xpPerLevel;
            const progressPercent = (xpInCurrentLevel / xpPerLevel) * 100;
            document.getElementById('stat-progress').style.width = `${progressPercent}%`;
        }

        function renderDictionary() {
            const container = document.getElementById('dict-list-container');
            const searchTerm = document.getElementById('dict-search').value.toLowerCase();
            const filterGrammar = document.getElementById('dict-grammar').value;
            const sortMode = document.getElementById('dict-sort').value;
            // 1. Filter
            let filtered = vocabData.map((item, index) => ({...item, originalIndex: index})).filter(item => {
                const matchesSearch = item.word.toLowerCase().includes(searchTerm) || 
                                      (item.en && item.en.toLowerCase().includes(searchTerm));
                const matchesGrammar = filterGrammar === 'All' || item.grammar === filterGrammar;
                return matchesSearch && matchesGrammar;
            });
            // 2. Sort
            filtered.sort((a, b) => {
                if (sortMode === 'alpha') return a.word.localeCompare(b.word);
                
                // Calculate mastery for sorting
                const getMastery = (word) => {
                    const stats = appState.wordStats[word];
                    if (!stats || stats.seen === 0) return sortMode === 'weakest' ? -1 : 101; 
                    return (stats.correct / stats.seen) * 100;
                };

                const masteryA = getMastery(a.word);
                const masteryB = getMastery(b.word);

                if (sortMode === 'weakest') return masteryA - masteryB;
                if (sortMode === 'strongest') return masteryB - masteryA;
                return 0;
            });

            // 3. Render HTML
            container.innerHTML = '';
            
            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 20px;">No words found matching criteria.</div>';
                return;
            }

            filtered.forEach(item => {
                const stats = appState.wordStats[item.word];
                let masteryHTML = `<span class="mastery-badge mastery-none">Not seen</span>`;
                
                if (stats && stats.seen > 0) {
                    const pct = Math.round((stats.correct / stats.seen) * 100);
                    let badgeClass = 'mastery-bad';
                    if (pct >= 80) badgeClass = 'mastery-good';
                    else if (pct >= 50) badgeClass = 'mastery-ok';
                    
                    masteryHTML = `<span class="mastery-badge ${badgeClass}">${pct}% Mastery</span>`;
                }

                const el = document.createElement('div');
                el.className = 'dict-item';
                el.onclick = () => openModal(item.originalIndex);
                
                el.innerHTML = `
                    <div>
                        <div class="dict-word-title">${item.word} ${item.emoji || ''}</div>
                        <div class="dict-translations">🇬🇧 ${item.en} | 🇪🇸 ${item.es}</div>
                    </div>
                    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:5px;">
                        ${masteryHTML}
                        <span style="font-size:0.8rem; color:#888;">Tap to open</span>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function openModal(index) {
            const data = vocabData[index];
            const modal = document.getElementById('word-modal');
            const contentArea = document.getElementById('modal-content-area');
            
            // Build the modal contents using the exact same HTML generator as the flashcard back
            contentArea.innerHTML = buildCardBackHTML(data, true);
            
            // Show modal
            modal.style.display = 'flex';
        }

        function closeModal(event) {
            if (event) event.stopPropagation();
            document.getElementById('word-modal').style.display = 'none';
        }

        function exportProgress() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "czech-it-up-progress-backup.json");
            document.body.appendChild(downloadAnchorNode); 
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importProgress(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedState = JSON.parse(e.target.result);
                    if (importedState && typeof importedState.xp !== 'undefined' && importedState.wordStats) {
                        appState = importedState;
                        saveState();
                        initApp();
                        alert("Progress imported successfully! 🎉");
                        switchTab('stats');
                    } else {
                        alert("Invalid backup file. Missing required data.");
                    }
                } catch(err) {
                    alert("Error parsing file. Please make sure it is a valid JSON backup.");
                }
                // Reset file input
                document.getElementById('import-file').value = '';
            };
            reader.readAsText(file);
        }

        function switchTab(tabName) {
            // Update buttons
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            // Update views
            document.getElementById(`tab-btn-${tabName}`).classList.add('active');
            document.getElementById(`view-${tabName}`).classList.add('active');
            
            if(tabName === 'dictionary') {
                renderDictionary();
            }
        }

        function resetProgress() {
            if(confirm("Are you sure you want to reset all your XP and mastery data? This cannot be undone.")) {
                localStorage.removeItem(STORAGE_KEY);
                appState = {
                    xp: 0, level: 1, cardsReviewed: 0, correctAnswers: 0, queue: [], currentQueuePos: 0, wordStats: {}
                };
                initApp();
                switchTab('practice');
            }
        }

        // Boot the app
        window.onload = initApp;

    </script>
</body>
