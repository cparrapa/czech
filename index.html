<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Czech It App v8</title>
    <!-- Using a bold, quirky font for that neobrutalist feel -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4db5e;
            --card-bg: #ffffff;
            --text-main: #111111;
            --border-color: #000000;
            --accent-blue: #70d6ff;
            --accent-pink: #ff70a6;
            --accent-green: #52b788;
            --accent-red: #ff9770;
            --accent-purple: #9d4edd;
            --accent-yellow: #ffd166;
            --accent-orange: #fca311;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Neobrutalism Base Class */
        .brutal {
            border: 4px solid var(--border-color);
            box-shadow: 6px 6px 0px var(--border-color);
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
        }

        .brutal-btn {
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            padding: 12px 24px;
            background: var(--card-bg);
            border: 4px solid var(--border-color);
            box-shadow: 4px 4px 0px var(--border-color);
            border-radius: 8px;
            transition: all 0.1s ease;
            font-family: inherit;
        }

        .brutal-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--border-color);
        }

        .brutal-input {
            padding: 12px;
            border: 3px solid var(--border-color);
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            box-shadow: 3px 3px 0px var(--border-color);
            outline: none;
            width: 100%;
            background: #fff;
            transition: all 0.1s ease;
        }
        
        .brutal-input:focus {
            box-shadow: 0px 0px 0px var(--border-color);
            transform: translate(3px, 3px);
            background: #fdfdfd;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }
        /* Top Bar: Stats & Gamification */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .nav-menu {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
            flex-wrap: wrap;
        }

        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-color);
            opacity: 0.7;
            min-width: 100px;
            font-size: 0.9rem;
        }

        .nav-tab.active {
            opacity: 1;
            background: var(--accent-yellow);
            box-shadow: 5px 5px 0px var(--border-color);
            transform: translate(-2px, -2px);
        }

        /* Tabs content visibility */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        /* Card Container & Flip Logic */
        .card-container {
            width: 100%;
            height: 640px; /* Increased slightly to fit example sentences */
            perspective: 1000px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background-color: var(--card-bg);
            padding: 25px;
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* Allows scrolling if content is too long */
            overflow-x: hidden;
        }

        /* Hide scrollbar for a cleaner look */
        .card-face::-webkit-scrollbar { width: 0px; }

        .card-front {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #fdfdfd;
        }

        /* Card Content Styles */
        .word-header {
            text-align: center;
            font-size: 3.2rem;
            font-weight: 700;
            margin: 20px 0;
            word-wrap: break-word;
        }

        .b-word-header {
            font-size: 2.2rem;
            margin-bottom: 5px;
            margin-top: 0;
            text-align: center;
        }

        .emoji-back {
            font-size: 3.5rem;
            text-align: center;
            margin-bottom: 5px;
        }

        .hint {
            background: var(--accent-blue);
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            width: 100%;
            margin-bottom: 15px;
        }

        .example-back {
            background: var(--accent-green);
            color: #fff;
            text-shadow: 1px 1px 0 #000;
        }

        /* Tags for Back of Card */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .tag {
            padding: 4px 10px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .t-gender { background: var(--accent-pink); }
        .t-grammar { background: var(--accent-blue); }
        .t-topic { background: var(--accent-yellow); }
        .t-plural { background: #eee; }

        .translations {
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-align: center;
            background: #fff;
            border: 2px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            box-shadow: 2px 2px 0px var(--border-color);
        }
        
        .translations p { margin: 5px 0; }

        .conjugation-box {
            background: var(--accent-purple);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 15px;
            color: #fff;
        }

        .conjugation-box h3 {
            font-size: 1rem;
            margin-bottom: 8px;
            text-align: center;
            text-transform: uppercase;
        }

        .conjugation-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .conj-item {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border: 2px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .conj-pronoun { font-weight: normal; font-size: 0.8rem; color: #444; }
        
        .fun-fact {
            background: var(--bg-color);
            padding: 12px;
            border: 2px solid var(--border-color);
            font-size: 0.95rem;
            margin-bottom: 20px;
            border-radius: 6px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .action-buttons button { flex: 1; font-size: 0.9rem; padding: 12px 10px; }
        .btn-correct { background-color: var(--accent-green); }
        .btn-ok { background-color: var(--accent-yellow); }
        .btn-train { background-color: var(--accent-pink); }
        .btn-flip { background-color: var(--text-main); color: white; width: 100%; margin-top: auto; }

        .audio-btn {
            background: var(--accent-red);
            font-size: 1.5rem;
            padding: 10px 30px;
            width: 10%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: auto;
        }

        .audio-btn-small {

            border: 2px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            padding: 4px 10px;
            margin-top: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #000;
        }
        .audio-btn-small:active { transform: scale(0.95); }

        .dictionary-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            background: var(--card-bg);
            padding: 15px;
            border: 4px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 4px 4px 0px var(--border-color);
        }

        .filter-group {
            display: flex;
            gap: 10px;
        }

        .dict-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 5px;
            padding-bottom: 20px;
        }
        
        .dict-list::-webkit-scrollbar { width: 8px; }
        .dict-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

        .dict-item {
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 3px 3px 0px var(--border-color);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .dict-item:hover {
            background: #fdfdfd;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-color);
        }

        .dict-word-title { font-size: 1.4rem; font-weight: bold; }
        .dict-translations { color: #555; font-size: 0.95rem; margin-top: 5px; }

        .mastery-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-weight: bold;
        }

        .mastery-good { background: var(--accent-green); }
        .mastery-ok { background: var(--accent-yellow); }
        .mastery-bad { background: var(--accent-pink); }
        .mastery-none { background: #eee; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            width: 100%;
            max-width: 500px;
            height: 640px;
            position: relative;
            transform: none; /* Overriding card-back transform */
            border-radius: 8px;
        }

        .close-modal-btn {
            background: var(--text-main);
            color: white;
            width: 100%;
            margin-top: auto;
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .stat-card h3 { font-size: 1rem; text-transform: uppercase; color: #555; }
        .stat-card .value { font-size: 2.5rem; font-weight: bold; }
        
        .c-blue { background: var(--accent-blue); }
        .c-green { background: var(--accent-green); }
        .c-pink { background: var(--accent-pink); }
        .c-red { background: var(--accent-red); }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #eee;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            background: var(--text-main);
            width: 0%;
            transition: width 0.3s;
        }

        .backup-controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .backup-controls button { flex: 1; }

        .fullscreen-btn {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 2px 5px;
            margin-right: 10px;
            transition: transform 0.1s;
        }
        .fullscreen-btn:active { transform: scale(0.9); }
        
        .header-progress-container {
            width: 100%;
            height: 8px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .header-progress-fill {
            height: 100%;
            background: var(--accent-green);
            width: 0%;
            transition: width 0.3s ease-out;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            backdrop-filter: blur(5px);
            padding: 20px;
        }

        .custom-modal-box {
            background: var(--card-bg);
            padding: 25px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            border-radius: 8px;
            border: 4px solid var(--border-color);
            box-shadow: 6px 6px 0px var(--border-color);
        }

        .custom-modal-msg {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .custom-modal-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="brutal" style="flex-direction: column; align-items: stretch;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display:  flex; align-items: center;">
                    <button class="fullscreen-btn" onclick="toggleFullScreen()" size=2px title="Toggle Fullscreen">⤢</button>
                </div>
                <div>🇨🇿 Czech It App</div>
                <div style="font-size: 1rem;">
                    Lvl <span id="top-level" style="background:var(--accent-yellow); padding: 2px 8px; border:2px solid #000; border-radius:4px;">1</span>
                </div>
            </div>
            <div class="header-progress-container" title="Progress to next level">
                <div class="header-progress-fill" id="header-progress"></div>
            </div>
        </header>

        <!-- Navigation -->
        <div class="nav-menu">
            <div class="nav-tab active" onclick="switchTab('practice')" id="tab-btn-practice">Karty 📇</div>
            <div class="nav-tab" onclick="switchTab('dictionary')" id="tab-btn-dictionary">Slovník 📖</div>
            <div class="nav-tab" onclick="switchTab('stats')" id="tab-btn-stats">Statistiky 📊</div>
        </div>

        <!-- Practice Tab -->
        <div id="view-practice" class="tab-content active">
            <div class="card-container">
                <div class="flashcard brutal" id="flashcard">
                    <!-- FRONT OF CARD -->
                    <div class="card-face card-front">
                        <h1 class="word-header" id="f-emoji"></h1> 
                        <!--<button class="brutal-btn audio-btn" onclick="playAudio(event, 'f-hint')" title="Play pronunciation"><span>🔊</span> 
                        </button>
                        <h1 class="word-header" id="f-word">Word</h1>-->
                        <h1 class="word-header" id="f-palabra">Palabra</h1>
                        <div class="hint brutal" id="f-hint" style="display: none;">Hint here</div>
                        <button class="brutal-btn btn-flip" onclick="flipCard()">Zobrazit odpověď 👁️</button>
                    </div>

                    <!-- BACK OF CARD -->
                    <div class="card-face card-back" id="card-back-content">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>

        <div id="view-dictionary" class="tab-content">
            <div class="dictionary-controls">
                <input type="text" id="dict-search" class="brutal-input" placeholder="Hledejte slovo ..." oninput="renderDictionary()">
                <div class="filter-group">
                    <select id="dict-grammar" class="brutal-input" onchange="renderDictionary()">
                        <option value="All">Celá gramatika</option>
                        <option value="Verb">Slovesa</option>
                        <option value="Noun">Podstatná jména</option>
                        <option value="Adjective">Přídavná jména</option>
                        <option value="Adverb">Příslovce</option>
                        <option value="Pronoun">Zájmena</option>
                        <option value="Conjunction">Konjunkce</option>
                        <option value="Phrase">Fráze</option>
                        <option value="Number">Čísla</option>
                    </select>
                    <select id="dict-topic" class="brutal-input" onchange="renderDictionary()">
                        <option value="All">Všechna témata</option>
                        <option value="Basics">Základy</option>
                        <option value="Food">Jídlo a Pití</option>
                        <option value="Family">Rodina a Domov</option>
                        <option value="Work">Práce a Komunikace</option>
                        <option value="Travel">Cestování a Místa</option>
                        <option value="Sports">Sport a Hobby</option>
                        <option value="Time">Čas</option>
                        <option value="Languages">Jazyky a Národnosti</option>
                    </select>
                    <select id="dict-sort" class="brutal-input" onchange="renderDictionary()">
                        <option value="alpha">A-Z</option>
                        <option value="weakest">Praxi ⚠️</option>
                        <option value="strongest">Zvládl 🏆</option>
                    </select>
                </div>
            </div>
            
            <div class="dict-list" id="dict-list-container">
                <!-- Dictionary items rendered via JS -->
            </div>
        </div>

        <!-- Stats Tab -->
        <div id="view-stats" class="tab-content">
            <div class="stats-grid">
                <div class="stat-card brutal c-blue">
                    <h3>Celkem XP ⭐</h3>
                    <div class="value" id="stat-xp">0</div>
                </div>
                <div class="stat-card brutal c-green">
                    <h3>Aktuální Úroveň 🎢</h3>
                    <div class="value" id="stat-level">1</div>
                    <div class="progress-bar"><div class="progress-fill" id="stat-progress"></div></div>
                </div>
                <div class="stat-card brutal c-pink">
                    <h3>Karty Zkontrolovány 🃏</h3>
                    <div class="value" id="stat-reviewed">0</div>
                </div>
                <div class="stat-card brutal c-red">
                    <h3>Přesnost 🎯</h3>
                    <div class="value" id="stat-accuracy">0%</div>
                </div>
            </div>
            
            <div class="backup-controls">
                <button class="brutal-btn" style="background: var(--accent-blue);" onclick="exportProgress()">Export Data 💾</button>
                <button class="brutal-btn" style="background: var(--accent-yellow);" onclick="document.getElementById('import-file').click()">Import Data 📂</button>
                <input type="file" id="import-file" style="display:none;" accept=".json" onchange="importProgress(event)">
            </div>

            <button class="brutal-btn" style="width: 100%; margin-top: 15px; background: white;" onclick="resetProgress()">
                Resetovat Průběh ⚠️
            </button>
        </div>
    </div>

    <div id="word-modal" class="modal-overlay" style="display:none;" onclick="closeModal(event)">
        <div class="modal-content brutal card-face card-back" id="modal-content-area" onclick="event.stopPropagation()">
            <!-- Populated by JS to look exactly like the back of the card -->
        </div>
    </div>

    <div id="custom-ui-modal" class="custom-modal-overlay">
        <div class="custom-modal-box">
            <div id="custom-ui-msg" class="custom-modal-msg">Message here</div>
            <div id="custom-ui-btns" class="custom-modal-btns">
                <!-- Buttons injected dynamically -->
            </div>
        </div>
    </div>

    <script>
        // Extensively expanded list based on the A1 curriculum provided, with sentences and notes!
        const vocabData = [
            { word: "A", emoji: "➕", hint: "Ty ___ já.", example: "Ty <b>a</b> já.", grammar: "Conjunction", topic: "Basics", en: "And", es: "Y", note: "Pronounced short, like the 'u' in 'cup'." },
            { word: "Adresa", emoji: "📍", hint: "Jaká je tvoje ___?", example: "Jaká je tvoje <b>adresa</b>?", grammar: "Noun", gender: "Feminine", plural: "adresy", topic: "Basics", en: "Address", es: "Dirección", note: "Addresses in Czechia usually have the street name first, then the number." },
            { word: "Aha", emoji: "💡", hint: "___, už rozumím.", example: "<b>Aha</b>, už rozumím.", grammar: "Phrase", topic: "Work", en: "Oh, I see", es: "Ah, ya veo", note: "A very common filler word to show you are following the conversation." },
            { word: "aktivita",emoji: "🏃",hint: "Sportovní ___",example: "Moje oblíbená aktivita je plavání.",grammar: "Noun (Feminine)",topic: "Sports",en: "activity",es: "actividad",conjugations: "",note: "International word, ends in -a making it feminine."},
            { word: "Ale", emoji: "⚖️", hint: "Je to drahé, ___ hezké.", example: "Je to drahé, <b>ale</b> hezké.", grammar: "Conjunction", topic: "Basics", en: "But", es: "Pero", note: "Requires a comma before it in written Czech." },
            { word: "americký",emoji: "🇺🇸",hint: "Pocházející z USA",example: "Mám rád americký fotbal.",grammar: "Adjective",topic: "Languages",en: "American",es: "americano",conjugations: "",note: "Adjectives end in -ý (masculine), -á (feminine), -é (neuter)."},
            { word: "Anglicky", emoji: "🇬🇧", hint: "Mluvíte ___?", example: "Mluvíte <b>anglicky</b>?", grammar: "Adverb", topic: "Languages", en: "English (language)", es: "Inglés", note: "Adverbs of language end in '-sky' or '-cky'." },
            { word: "Ano / Jo", emoji: "✅", hint: "___, prosím.", example: "<b>Ano</b>, prosím.", grammar: "Phrase", topic: "Basics", en: "Yes / Yeah", es: "Sí", note: "'Jo' is the extremely common informal version of 'Ano'." },

        const STORAGE_KEY = 'czechA1AppProgressV3';
        
        let appState = {
            xp: 0,
            level: 1,
            cardsReviewed: 0,
            correctAnswers: 0,
            queue: [], // Array of indices
            currentQueuePos: 0,
            wordStats: {} // Tracks individual word mastery { "Být": { seen: 0, correct: 0 } }
        };

        const xpPerLevel = 50;

        function initApp() {
            loadState();
            
            // Ensure all words exist in wordStats
            vocabData.forEach(item => {
                if (!appState.wordStats[item.word]) {
                    appState.wordStats[item.word] = { seen: 0, correct: 0, interval: 0, ease: 2.5, nextReview: null };
                } else if (appState.wordStats[item.word].interval === undefined) {
                    // Migrate older save files to SRS
                    appState.wordStats[item.word].interval = 0;
                    appState.wordStats[item.word].ease = 2.5;
                    appState.wordStats[item.word].nextReview = null;
                }
            });

            generateQueue();
            
            updateStatsUI();
            loadCardToDOM(appState.queue[appState.currentQueuePos]);
            // Ensure dictionary is populated immediately
            renderDictionary(); 
        }

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    // Merge saved state with defaults to handle version updates
                    appState = { ...appState, ...parsed };
                    if (!appState.wordStats) appState.wordStats = {};
                    if (!appState.queue || appState.queue.length === 0) generateQueue();
                } catch (e) {
                    console.error("Failed to parse save data");
                }
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        }

        function generateQueue() {
            const now = Date.now();
            let dueIndices = [];
            let newIndices = [];
            
            vocabData.forEach((item, index) => {
                const stats = appState.wordStats[item.word];
                if (!stats.nextReview) {
                    newIndices.push(index);
                } else if (stats.nextReview <= now) {
                    dueIndices.push(index);
                }
            });

            // Shuffle arrays to mix it up
            dueIndices.sort(() => Math.random() - 0.5);
            newIndices.sort(() => Math.random() - 0.5);

            // Prioritize due cards, add a few new ones
            appState.queue = [...dueIndices, ...newIndices.slice(0, 10)];
            
            // If everything is completely caught up, give them some random practice cards
            if (appState.queue.length === 0) {
                let randomIndices = Array.from({length: vocabData.length}, (_, i) => i);
                randomIndices.sort(() => Math.random() - 0.5);
                appState.queue = randomIndices.slice(0, 15);
            }

            appState.currentQueuePos = 0;
            saveState();
        }

        function buildCardBackHTML(data, isModal = false) {
            let html = `
                
                <div class="emoji-back" id="b-emoji">${data.emoji || '🇨🇿'}</div> 
                <h1 class="word-header b-word-header" id="b-word">${data.word}</h1>
                
                <div class="tags">
                    ${data.grammar ? `<span class="tag t-grammar">${data.grammar}</span>` : ''}
                    ${data.gender ? `<span class="tag t-gender">${data.gender}</span>` : ''}
                    ${data.topic ? `<span class="tag t-topic">${data.topic}</span>` : ''}
                    ${data.plural ? `<span class="tag t-plural">Plural: ${data.plural}</span>` : ''}
                </div>
                <div class="translations">
                    <p>🇪🇸:</strong> <span id="b-es">${data.es || 'N/A'}  🇬🇧:</strong> <span id="b-en">${data.en || 'N/A'}</span></p>
                </div>
                `;
            if (data.note) {
                html += `<div class="fun-fact" id="b-note">💡 <strong>Note:</strong> ${data.note}</div>`;
            }

            if (data.example) {
                // Strip HTML tags for clean audio reading
                const cleanExample = data.example.replace(/<[^>]*>?/gm, '');
                html += `<div class="hint brutal example-back" id="b-example">
                            ${data.example}
                            <button class="audio-btn-small" onclick="playAudio(event, null, '${cleanExample}')"> 🔊 </button>
                         </div>`;
            }

            if (data.grammar === 'Verb' && data.conjugations) {
                html += `
                <div class="conjugation-box" id="b-conjugations">
                    <h3>Conjugation (Present)</h3>
                    <div class="conjugation-grid">
                        <div class="conj-item"><span class="conj-pronoun">já</span> <span>${data.conjugations.ja}</span></div>
                        <div class="conj-item"><span class="conj-pronoun">my</span> <span>${data.conjugations.my}</span></div>
                        <div class="conj-item"><span class="conj-pronoun">ty</span> <span>${data.conjugations.ty}</span></div>
                        <div class="conj-item"><span class="conj-pronoun">vy</span> <span>${data.conjugations.vy}</span></div>
                        <div class="conj-item"><span class="conj-pronoun">on/a/to</span> <span>${data.conjugations.on}</span></div>
                        <div class="conj-item"><span class="conj-pronoun">oni/y/a</span> <span>${data.conjugations.oni}</span></div>
                    </div>
                </div>`;
            }


            if (isModal) {
                html += `<button class="brutal-btn close-modal-btn" onclick="closeModal(event)">Close ❌</button>`;
            } else {
                html += `
                <div class="action-buttons">
                    <button class="brutal-btn btn-train" onclick="handleSRS('again')">Znovu 🧠</button>
                    <button class="brutal-btn btn-ok" onclick="handleSRS('good')">Dobrý 👍</button>
                    <button class="brutal-btn btn-correct" onclick="handleSRS('easy')">Snadný ⚡</button></div><br>
                    <button class="brutal brutal-btn " onclick="unflipCard()">Převrátit zpět ⬅️</button>
                `;
            }

            return html;
        }

        const card = document.getElementById('flashcard');

        function loadCardToDOM(vocabIndex) {
            // Guard clause if index is somehow invalid
            if (vocabIndex === undefined || !vocabData[vocabIndex]) {
                generateQueue();
                vocabIndex = appState.queue[appState.currentQueuePos];
            }

            const data = vocabData[vocabIndex];
            
            // Front
            document.getElementById('f-emoji').innerText = data.emoji;
            //document.getElementById('f-word').innerText = data.en;
            document.getElementById('f-palabra').innerText = data.es;
            const hintEl = document.getElementById('f-hint');
            if (data.hint) {
                hintEl.innerHTML = data.hint;
                hintEl.style.display = 'block';
            } else {
                hintEl.style.display = 'none';
            }
            
            // Back
            const backContainer = document.getElementById('card-back-content');
            backContainer.innerHTML = buildCardBackHTML(data, false);

            // Reset visual flip
            card.style.transition = 'none';
            card.classList.remove('is-flipped');
            setTimeout(() => { card.style.transition = 'transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1)'; }, 50);
        }

        function flipCard() {card.classList.add('is-flipped');}
        function unflipCard() {card.classList.remove('is-flipped'); }

        // Simulating Audio (Using Web Speech API)
        function playAudio(event, elementId = null, specificWord = null) {
            event.stopPropagation(); 
            
            let wordToSay = specificWord;
            if (!wordToSay) {
                if (elementId) {
                    wordToSay = document.getElementById(elementId).innerText;
                } else {
                    const index = appState.queue[appState.currentQueuePos];
                    wordToSay = vocabData[index].word;
                }
            }
            
            const utterance = new SpeechSynthesisUtterance(wordToSay);
            utterance.lang = 'cs-CZ'; 
            utterance.rate = 0.8; // Slightly slower for learning
            
            window.speechSynthesis.speak(utterance);
        }

        // Handle the user's answer
        function handleSRS(rating) {
            const currentWordIndex = appState.queue[appState.currentQueuePos];
            const currentWord = vocabData[currentWordIndex].word;
            let stats = appState.wordStats[currentWord];
            
            stats.seen++;
            const now = Date.now();
            
            if (rating === 'again') {
                stats.interval = 0;
                stats.ease = Math.max(1.3, stats.ease - 0.2);
                // Review again in 1 minute
                stats.nextReview = now + 60 * 1000; 
                // Push to end of current queue so we see it again this session
                appState.queue.push(currentWordIndex);
            } else {
                stats.correct++;
                appState.correctAnswers++;
                appState.xp += (rating === 'easy' ? 15 : 10);
                
                // Level Up Check
                const newLevel = Math.floor(appState.xp / xpPerLevel) + 1;
                if (newLevel > appState.level) {
                    appState.level = newLevel;
                }

                // SuperMemo-2 style pacing
                if (rating === 'good') {
                    stats.interval = stats.interval === 0 ? 1 : Math.round(stats.interval * stats.ease);
                } else if (rating === 'easy') {
                    stats.interval = stats.interval === 0 ? 3 : Math.round(stats.interval * stats.ease * 1.3);
                    stats.ease += 0.15;
                }
                
                // Set next review date based on interval (in days)
                stats.nextReview = now + (stats.interval * 24 * 60 * 60 * 1000);
            }

            appState.cardsReviewed++;
            appState.currentQueuePos++;
            
            // Check if queue is finished
            if (appState.currentQueuePos >= appState.queue.length) {
                // Silently loop and reshuffle when deck finishes to avoid popup interruptions
                generateQueue();
            }

            saveState();
            updateStatsUI();
            if (document.getElementById('view-dictionary').classList.contains('active')) {
                renderDictionary(); // Update mastery badges in background
            }
            loadCardToDOM(appState.queue[appState.currentQueuePos]);
        }

        function updateStatsUI() {
            document.getElementById('top-level').innerText = appState.level;
            document.getElementById('stat-xp').innerText = appState.xp;
            document.getElementById('stat-level').innerText = appState.level;
            document.getElementById('stat-reviewed').innerText = appState.cardsReviewed;
            
            let accuracy = 0;
            if (appState.cardsReviewed > 0) {
                accuracy = Math.round((appState.correctAnswers / appState.cardsReviewed) * 100);
            }
            document.getElementById('stat-accuracy').innerText = `${accuracy}%`;

            // Progress bar to next level
            const xpInCurrentLevel = appState.xp % xpPerLevel;
            const progressPercent = (xpInCurrentLevel / xpPerLevel) * 100;
            document.getElementById('stat-progress').style.width = `${progressPercent}%`;
            document.getElementById('header-progress').style.width = `${progressPercent}%`;
        }

        function renderDictionary() {
            const container = document.getElementById('dict-list-container');
            const searchTerm = document.getElementById('dict-search').value.toLowerCase();
            const filterGrammar = document.getElementById('dict-grammar').value;
            const filterTopic = document.getElementById('dict-topic').value;
            const sortMode = document.getElementById('dict-sort').value;
            // 1. Filter
            let filtered = vocabData.map((item, index) => ({...item, originalIndex: index})).filter(item => {
                const matchesSearch = item.word.toLowerCase().includes(searchTerm) || 
                                      (item.en && item.en.toLowerCase().includes(searchTerm))|| 
                                      (item.es && item.es.toLowerCase().includes(searchTerm));
                const matchesGrammar = filterGrammar === 'All' || item.grammar === filterGrammar;
                const matchesTopic = filterTopic === 'All' || item.topic === filterTopic;
                return matchesSearch && matchesGrammar && matchesTopic;
            });
            // 2. Sort
            filtered.sort((a, b) => {
                if (sortMode === 'alpha') return a.word.localeCompare(b.word);
                
                // Calculate mastery for sorting
                const getMastery = (word) => {
                    const stats = appState.wordStats[word];
                    if (!stats || stats.seen === 0) return sortMode === 'weakest' ? -1 : 101; 
                    return (stats.correct / stats.seen) * 100;
                };

                const masteryA = getMastery(a.word);
                const masteryB = getMastery(b.word);

                if (sortMode === 'weakest') return masteryA - masteryB;
                if (sortMode === 'strongest') return masteryB - masteryA;
                return 0;
            });

            // 3. Render HTML
            container.innerHTML = '';
            
            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 20px;">No words found matching criteria.</div>';
                return;
            }

            filtered.forEach(item => {
                const stats = appState.wordStats[item.word];
                let masteryHTML = `<span class="mastery-badge mastery-none">Not seen</span>`;
                
                if (stats && stats.seen > 0) {
                    const pct = Math.round((stats.correct / stats.seen) * 100);
                    let badgeClass = 'mastery-bad';
                    if (pct >= 80) badgeClass = 'mastery-good';
                    else if (pct >= 50) badgeClass = 'mastery-ok';
                    
                    masteryHTML = `<span class="mastery-badge ${badgeClass}">${pct}% Mastery</span>`;
                }

                const el = document.createElement('div');
                el.className = 'dict-item';
                el.onclick = () => openModal(item.originalIndex);
                
                el.innerHTML = `
                    <div>
                        <div class="dict-word-title">${item.word} ${item.emoji || ''}</div>
                        <div class="dict-translations">🇪🇸 ${item.es} | 🇬🇧 ${item.en} </div>
                    </div>
                    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:5px;">
                        ${masteryHTML}
                        <span style="font-size:0.8rem; color:#888;">Tap to open</span>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function openModal(index) {
            const data = vocabData[index];
            const modal = document.getElementById('word-modal');
            const contentArea = document.getElementById('modal-content-area');
            
            // Build the modal contents using the exact same HTML generator as the flashcard back
            contentArea.innerHTML = buildCardBackHTML(data, true);
            
            // Show modal
            modal.style.display = 'flex';
        }

            if (event) event.stopPropagation();
            document.getElementById('word-modal').style.display = 'none';

            const btnsEl = document.getElementById('custom-ui-btns');
            
            msgEl.innerText = msg;

            if (onConfirm) {
                const btnCancel = document.createElement('button');
                btnCancel.className = 'brutal-btn';
                btnCancel.style.background = 'var(--accent-red)';
                btnCancel.innerText = 'Zrušit (Cancel)';
                btnCancel.onclick = () => { overlay.style.display = 'none'; };
                
                const btnOk = document.createElement('button');
                btnOk.className = 'brutal-btn';
                btnOk.style.background = 'var(--accent-green)';
                btnOk.innerText = 'Ano (Yes)';
                btnOk.onclick = () => { overlay.style.display = 'none'; onConfirm(); };

                const btnOk = document.createElement('button');
                btnOk.className = 'brutal-btn';
                btnOk.style.background = 'var(--accent-blue)';
                btnOk.innerText = 'OK';
                btnOk.onclick = () => { overlay.style.display = 'none'; };
                btnsEl.appendChild(btnOk);
            }
            
            overlay.style.display = 'flex';
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function exportProgress() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "czech-it-up-progress-backup.json");
            document.body.appendChild(downloadAnchorNode); 
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importProgress(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedState = JSON.parse(e.target.result);
                    if (importedState && typeof importedState.xp !== 'undefined' && importedState.wordStats) {
                        appState = importedState;
                        saveState();
                        initApp();
                        showCustomModal("Progress imported successfully! 🎉");
                        switchTab('stats');
                    } else {
                        showCustomModal("Invalid backup file. Missing required data.");
                    }
                } catch(err) {
                    showCustomModal("Error parsing file. Please make sure it is a valid JSON backup.");
                }
                // Reset file input
                document.getElementById('import-file').value = '';
            };
            reader.readAsText(file);
        }

        function switchTab(tabName) {
            // Update buttons
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            // Update views
            document.getElementById(`tab-btn-${tabName}`).classList.add('active');
            document.getElementById(`view-${tabName}`).classList.add('active');
            
            if(tabName === 'dictionary') {
                renderDictionary();
            }
        }

        function resetProgress() {
            showCustomModal("Are you sure you want to reset all your XP and mastery data? This cannot be undone.", () => {
                localStorage.removeItem(STORAGE_KEY);
                appState = {
                    xp: 0, level: 1, cardsReviewed: 0, correctAnswers: 0, queue: [], currentQueuePos: 0, wordStats: {}
                };
                initApp();
                switchTab('practice');
            });
        }

        // Boot the app
        window.onload = initApp;

    </script>
</body>
</html>
